[tasks.connect]
usage = 'arg "[path]" default="kb-mod-monitor-dev.sock"'
run = 'cargo run --example cli -- {{usage.path}}'

[tasks.build]
run = 'cargo build'

[tasks.dev]
depends = ['build']
usage = 'arg "[log_level]" default="trace"'
run = 'sudo RUST_LOG={{usage.log_level}} ./target/debug/kb-mod-monitor --dev'
