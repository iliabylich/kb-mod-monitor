monorepo_root = true

[monorepo]
config_roots = [".github"]

[tools]
cargo-binstall = "latest"

[settings]
cargo.binstall_quickinstall = true
cargo.binstall_only = true

[task_config]
shell = "bash -euo pipefail -c"

[tasks.connect]
usage = 'arg "[path]" default="kb-mod-monitor-dev.sock"'
run = 'cargo run --example cli -- {{usage.path}}'

[tasks.build]
run = 'cargo build'

[tasks.dev]
depends = ['build']
usage = 'arg "[log_level]" default="trace"'
run = 'sudo RUST_LOG={{usage.log_level}} ./target/debug/kb-mod-monitor --dev'

[tasks.release]
run = 'cargo build --release'

[tasks."cargo:outdated"]
hide = true
tools = { "cargo:cargo-outdated" = "latest" }
run = "cargo outdated"

[tasks.outdated]
run = [
    { task = "cargo:outdated" },
    { task = "//.github:outdated" },
]
