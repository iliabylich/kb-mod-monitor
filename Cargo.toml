[package]
name = "kb-mod-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
] }
evdev = "0.13"
log = "0.4"
rustix = { version = "1.1", features = ["fs", "event", "net"] }
xkbcommon = { version = "0.9", features = ["wayland"] }
sd-listen-fds = "0.2"
pollsendd = { version = "0.1.0" }
